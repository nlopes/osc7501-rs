[package]
name = "osc7501-store"
description = "Bounded OSC 7501 terminal records with optional allocation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
readme = "README.md"
exclude = ["/tests/**"]

[features]
default = []
alloc = []

[package.metadata.docs.rs]
all-features = true

[dependencies]
osc7501-parser = { path = "../osc7501-parser", version = "0.1.0" }
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
allocation-counter = "0.8.1"
base64 = "0.23.1"
hegeltest.workspace = true

[[example]]
name = "observe"
required-features = ["alloc"]
