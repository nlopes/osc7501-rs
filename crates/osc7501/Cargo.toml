[package]
name = "osc7501-rs"
description = "Typed OSC 7501 reports and terminal capability replies"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
readme = "README.md"

[lib]
name = "osc7501"

[features]
store = ["dep:osc7501-store"]
store-alloc = ["store", "osc7501-store/alloc"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
osc7501-parser = { path = "../osc7501-parser", version = "0.1.0" }
osc7501-store = { path = "../osc7501-store", version = "0.1.0", optional = true }
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
allocation-counter = "0.8.1"
proptest.workspace = true
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }

[[example]]
name = "host"
required-features = ["store-alloc"]
test = true
