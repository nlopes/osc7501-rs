[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/nlopes/osc7501-rs"
publish = ["crates-io"]
license = "MIT"

[workspace.dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
thiserror = { version = "2.0.21", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "forbid"

[workspace.lints.clippy]
cast_possible_truncation = "deny"
panic = "deny"
pedantic = { level = "deny", priority = -1 }
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
