name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: '*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny --all-features --locked check

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          env-vars: ImageOS
      - run: cargo fmt --all --check
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  compatibility:
    name: Rust ${{ matrix.rust }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: ['1.88.0', stable]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          env-vars: ImageOS
      - uses: taiki-e/install-action@nextest
      - run: cargo +${{ matrix.rust }} clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +${{ matrix.rust }} nextest run --workspace --all-targets --locked
      - run: cargo +${{ matrix.rust }} test --workspace --doc --locked
      - run: cargo +${{ matrix.rust }} clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo +${{ matrix.rust }} nextest run --workspace --all-targets --all-features --locked
      - run: cargo +${{ matrix.rust }} test --workspace --doc --all-features --locked

  no-std:
    name: Parser and store without std on Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.88.0', stable]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          env-vars: ImageOS
      - run: cargo +${{ matrix.rust }} check -p osc7501-parser -p osc7501-store --lib --target thumbv7em-none-eabihf --locked
