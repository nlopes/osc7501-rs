name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install nextest
        run: |
          curl -LsSf https://get.nexte.st/latest/linux -o /tmp/nextest.tar.gz
          tar --no-same-owner -xzf /tmp/nextest.tar.gz -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings -D clippy::todo
      - run: cargo nextest run --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
